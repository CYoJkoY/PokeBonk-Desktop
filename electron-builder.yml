# Cliente de escritorio de PokéBonk (docs/RUNTIME.md). `bun run dist:win|mac|linux`; salida en release/.
appId: com.pokebonk.desktop
productName: PokéBonk
# Nombre del .exe y del binario sin tilde (rutas, registro y AppImage).
executableName: PokeBonk
artifactName: PokeBonk-${version}-${os}-${arch}.${ext}
copyright: Fan-game no oficial, gratuito y sin ánimo de lucro. Pokémon es de Nintendo, Creatures y GAME FREAK.
directories:
  output: release
  buildResources: build
files:
  # The flat application modules (main, preload, discord, updater, text and the rest of src/*.ts).
  - out/*.js
  - out/pages/**/*.js
  - static/**
  - build/icon.png
  - package.json
  - client.json
# Automatic updates (src/updater.ts, docs/RUNTIME.md): electron-updater reads latest.yml / latest-linux.yml from the latest release
# of this distribution. client.json explicitly controls runtime opt-in. `--publish never` still writes update metadata.
publish:
  provider: github
  owner: CYoJkoY
  repo: PokeBonk-Desktop
  releaseType: release
asar: true
compression: maximum
# Solo el idioma de cada jugador cambia los textos de Chromium (menús contextuales): el resto de locales sobra.
electronLanguages: [es, en-US, pt-BR, fr, ja, zh-CN, zh-TW, ko, ru]
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Multi-size .ico (16–256 px) for the .exe, the installer and the shortcuts; the PNG below serves macOS and Linux.
  icon: build/icon.ico
nsis:
  # Assisted installer (next client version): it lets the player choose the folder (reports 17366, 17438: «why C: by default»),
  # always makes the desktop shortcut and starts the game at the end. Still per user (no administrator).
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  shortcutName: PokéBonk
  artifactName: PokeBonk-${version}-win-setup.${ext}
portable:
  artifactName: PokeBonk-${version}-win-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  category: public.app-category.games
  icon: build/icon.png
  # The bundle and its helpers are built with productName=PokeBonk (ASCII, the `--mac` job of the workflow and `npm run dist:mac`):
  # electron-builder writes the helper folders in NFD and CFBundleName in NFC, so with «é» Electron cannot find its helpers and
  # the 1.4.0 crashed on launch (SIGTRAP, issue #5 of pokebonk-app). Finder and the Dock still show the accent.
  extendInfo:
    CFBundleDisplayName: PokéBonk
  # Sin cuenta de Apple Developer no hay notarización, pero sí firma ad-hoc («-»): sin ninguna firma, el Mac con
  # Apple Silicon dice que la app «está dañada» y no deja abrirla. Con la ad-hoc, la primera vez se abre desde
  # Configuración → Privacidad y seguridad → «Abrir igualmente» (docs/RUNTIME.md).
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Game
  icon: build/icon.png
  maintainer: Charcher
  synopsis: PokéBonk, survivor 3D (fan-game)

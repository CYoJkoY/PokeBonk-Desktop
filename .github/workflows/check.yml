name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Exercise the desktop bridge in Electron
        if: runner.os != 'Linux'
        run: bun run smoke
      - name: Exercise the desktop bridge under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run smoke

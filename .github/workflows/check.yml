name: Check
# Un push a una rama con PR abierto dispara `push` y `pull_request`: la matriz entera corría dos veces por commit y
# duplicaba la cola de macOS. Las ramas de trabajo se comprueban en su PR; `main` sigue comprobándose al recibir el merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        # `macos-latest` es macOS 26 arm64 y GitHub avisa de restricciones de capacidad para arm64: los trabajos
        # esperaban en cola más de 15 minutos y se cancelaban sin ejecutar un solo paso. La imagen x64 equivalente
        # (el DMG se publica universal, así que el shell se comprueba en las dos arquitecturas) se adquiere siempre.
        os: [windows-latest, macos-26-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # v5 runs on the Node 24 runtime the runners now force for v4, which removes the deprecation notice.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Exercise the desktop bridge in Electron
        if: runner.os != 'Linux'
        run: bun run smoke
      - name: Exercise the desktop bridge under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run smoke

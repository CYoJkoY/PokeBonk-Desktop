# PokéBonk desktop fork (docs/RUNTIME.md). This repo holds the client's source
# and its downloads. A tag `v*` builds Windows, macOS and Linux on
# GitHub's machines and leaves everything in a DRAFT release of that tag: the installers plus latest*.yml and the .blockmap files the
# automatic updater reads (src/updater.ts). Publishing the draft is what makes the clients update. Also by hand (Actions → Release →
# Run workflow): the installers stay as the run's artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      # The gate runs the compiled check: the sources are TypeScript (src/tools).
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node out/tools/check-release-version.js "$GITHUB_REF_NAME"

  build:
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            # ASCII bundle name: with «é» the helpers end up NFD and CFBundleName NFC, and the app crashes on launch (issue #5).
            target: --mac -c.productName=PokeBonk
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      # No certificates: ad-hoc signature on the Mac (electron-builder.yml) and none on Windows.
      - run: bun run electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged application contents
        if: runner.os == 'Windows'
        run: bun run verify:package
      # The DMG as players get it: the helpers must have exactly the bytes of CFBundleName (issue #5), and the packaged app
      # must run the pages in its own asar - the game window with the preload bridge, the offline page, the loading screen -
      # then quit by itself. Those are the loopback fixtures of src/tools/smoke.ts: the check must never wait for the live game
      # to answer a CI runner, which is what hung the v1.5.4 run for 90 s with no report (issue #9).
      - name: Check the macOS app from the DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/pb -nobrowse -readonly
          app=$(ls -d /tmp/pb/*.app | head -1)
          name=$(plutil -extract CFBundleName raw -o - "$app/Contents/Info.plist")
          exe=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          ls "$app/Contents/Frameworks" | grep ' Helper' | sed 's/ Helper.*//' | sort -u > /tmp/helpers.txt
          echo "CFBundleName: $name"; cat /tmp/helpers.txt
          [ "$(cat /tmp/helpers.txt)" = "$name" ] || { echo "Helper names do not match CFBundleName"; exit 1; }
          # Out of the image before the first launch, which is what a player does (drag to /Applications): launched from the
          # read-only mount the client starts loading and then never reaches dom-ready, so the smoke flows time out there
          # while the very same bundle passes in about 11 s from any writable path (issue #9).
          rm -rf /tmp/pbapp && mkdir -p /tmp/pbapp && cp -R "$app" /tmp/pbapp/
          installed=$(ls -d /tmp/pbapp/*.app | head -1)
          node out/tools/smoke.js "$installed/Contents/MacOS/$exe"
          hdiutil detach /tmp/pb
      - uses: actions/upload-artifact@v4
        with:
          name: pokebonk-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: PokéBonk ${{ github.ref_name }}
          files: dist/*
